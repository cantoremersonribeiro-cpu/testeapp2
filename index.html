<h1>Read the map, not the music</h1>
<p class="lead">Everything in this guide is drawn, not written. If you can count to four and find a key on a
picture, you can use every page.</p>
<div class="kbsmall"><svg viewBox="0 0 420 207" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Barlow Condensed, sans-serif"><rect x="0" y="0" width="420" height="207" rx="12" fill="#17181B"/><rect x="15.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="38.5" y="169.0" text-anchor="middle" font-size="11" font-weight="700" fill="#17181B">C</text><rect x="64.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="87.5" y="169.0" text-anchor="middle" font-size="10" font-weight="500" fill="#9a917f">D</text><rect x="113.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="136.5" y="169.0" text-anchor="middle" font-size="10" font-weight="500" fill="#9a917f">E</text><rect x="162.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="185.5" y="169.0" text-anchor="middle" font-size="10" font-weight="500" fill="#9a917f">F</text><rect x="211.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="234.5" y="169.0" text-anchor="middle" font-size="10" font-weight="500" fill="#9a917f">G</text><rect x="260.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="283.5" y="169.0" text-anchor="middle" font-size="10" font-weight="500" fill="#9a917f">A</text><rect x="309.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="332.5" y="169.0" text-anchor="middle" font-size="10" font-weight="500" fill="#9a917f">B</text><rect x="358.0" y="30" width="47.0" height="147.0" rx="3" fill="#F4EFE6" stroke="#cfc6b5"/><text x="381.5" y="169.0" text-anchor="middle" font-size="11" font-weight="700" fill="#17181B">C</text><rect x="48.3" y="30" width="29.4" height="91.1" rx="2" fill="#1d1e22" stroke="#000"/><rect x="97.3" y="30" width="29.4" height="91.1" rx="2" fill="#1d1e22" stroke="#000"/><rect x="195.3" y="30" width="29.4" height="91.1" rx="2" fill="#1d1e22" st <h3>How to read a diagram</h3>
<div class="tw"><table class="t "><tr><th>you see</th><th>it means</th></tr><tr><td><b class="r">● 5</b></td><td>Press this key with finger <b>5</b>. The number is always the finger, never the note.</td></tr><tr><td><b>C D E…</b></td><td>The gray letters at the bottom of each white key are the note names. Every C is in bold.</td></tr><tr><td><b>MIDDLE C</b></td><td>The C in the middle of the piano. Your left hand lives to its left.</td></tr><tr><td><b>C+G</b></td><td>Two keys pressed together, at the same moment.</td></tr><tr><td><b>C′</b></td><td>The next C up: the same note, one octave higher.</td></tr><tr><td><b>—</b></td><td>Keep holding what you are already pressing.</td></tr></table></div>
<h3>How to read a rhythm</h3>
<div class="tw"><table class="grid g3"><tr><th class="strong">1</th><th class="beat">2</th><th class="beat">3</th></tr><tr><td>C</td><td>E+G</td><td>E+G</td></tr></table></div>
<p>The top row is what you count out loud; the bottom row is what you play. The dark cell is beat 1, the strong
one. When the counting reads “1 & 2 &”, each cell is half a beat.</p>
<div class="box dark"><b>Go in order.</b> Each part leans on the one before it. The patterns only start to sound like music once the chords on pages 9 to 12 are under your fingers.</div>

<h3>Finding C</h3>
<p>Look at the black keys: they come in groups of <b>two</b> and <b>three</b>. The white key just to the left of
every group of two is a <b>C</b>. Always.</p>
<h3>Your territory</h3>
<p>The dashed frame is where the left hand plays in this guide: the two octaves below <b>middle C</b>. Low enough to
sound like a bass, close enough not to clash with the melody.</p>
<div class="tw"><table class="t "><tr><th>name</th><th>where</th><th>used for</th></tr><tr><td><b>Middle C</b></td><td>The C nearest the center of the piano, often under the brand name</td><td>The border between the hands</td></tr><tr><td><b>C below middle C</b></td><td>The next C to the left of middle C</td><td>Home for most patterns in this guide</td></tr><tr><td><b>Low C</b></td><td>The C after that, further left</td><td>Wide patterns: Octave Pulse, Ballad, Arpeggio</td></tr></table></div>
<div class="box dark"><b>Keyboard or digital piano?</b> Everything here works on any instrument with at least 49 keys. On a 61-key keyboard, middle C is usually the third C from the left.</div>

<h1>The fingers of your left hand</h1>
<p class="lead">Pianists number the fingers from the thumb outward. In the left hand that means the
<b>pinky is 5</b> and the <b>thumb is 1</b>.</p>
<div class="kbsmall"><svg viewBox="0 0 520 210" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Barlow Condensed">
<rect width="520" height="210" rx="12" fill="#17181B"/><rect x="44" y="70" width="52" height="120" rx="26" fill="#F4EFE6"/><circle cx="70" cy="100" r="19" fill="#9E3F12" stroke="#fff" stroke-width="1.5"/><text x="70" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text><text x="70" y="204" text-anchor="middle" font-size="12" letter-spacing="1" fill="#E9C77D">PINKY</text><rect x="134" y="40" width="52" height="150" rx="26" fill="#F4EFE6"/><circle cx="160" cy="70" r="19" fill="#9E3F12" stroke="#fff" stroke-width="1.5"/><text x="160" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="160" y="204" text-anchor="middle" font-size="12" letter-spacing="1" fill="#E9C77D">RING</text><rect x="224" y="28" width="52" height="162" rx="26" fill="#F4EFE6"/><circle cx="250" cy="58" r="19" fill="#9E3F12" stroke="#fff" stroke-width="1.5"/><text x="250" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="250" y="204" text-anchor="middle" font-size="12" letter-spacing="1" fill="#E9C77D">MIDDLE</text><rect x="314" y="44" width="52" height="146" rx="26" fill="#F4EFE6"/><circle cx="340" cy="74" r="19" fill="#9E3F12" stroke="#fff" stroke-width="1.5"/><text x="340" y="82" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="340" y="204" text-anchor="middle" font-size="12" letter-spacing="1" fill="#E9C77D">INDEX</text><rect x="414" y="110" width="52" height="80" rx="26" fill="#F4EFE6"/><circle cx="440" cy="140" r="19" fill="#9E3F12" stroke="#fff" stroke-width="1.5"/><text x="440" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="440" y="204" text-anchor="middle" font-size="12" letter-spacing="1" fill="#E9C77D">THUMB</text></svg></div>
<p class="cap">Your left hand, palm down, as you see it over the keys.</p>
<h3>The one rule of this guide</h3>
<p>In almost every pattern, <b>finger 5 sits on the root</b>, the note that gives the chord its name. Find the root,
put your pinky on it, and the rest of the hand falls into place to its right.</p>
<div class="tw"><table class="t "><tr><th>finger</th><th>name</th><th>usual job</th></tr><tr><td><b class="r">5</b></td><td>pinky</td><td>the root: the lowest note and the anchor</td></tr><tr><td><b class="r">3</b></td><td>middle</td><td>the third of the chord</td></tr><tr><td><b class="r">2</b></td><td>index</td><td>the fifth, when the thumb is busy higher up</td></tr><tr><td><b class="r">1</b></td><td>thumb</td><td>the fifth or the octave: the top of the hand</td></tr></table></div>
<div class="box dark"><b>Curved fingers.</b> Play on the tips, with the fingers curved as if holding a ball. A flat pinky is weak and catches the black keys.</div>

<p class="cap">Where your pinky goes for each chord. <span class="r">Rust = major</span> · <span class="t">teal = minor</span>.</p>
<div class="tw"><table class="t "><tr><th>chord</th><th>type</th><th>notes</th><th>fingers</th></tr><tr><td><b class="r">C</b></td><td>major</td><td>C · E · G</td><td>5 · 3 · 1</td></tr><tr><td><b class="t">Dm</b></td><td>minor</td><td>D · F · A</td><td>5 · 3 · 1</td></tr><tr><td><b class="t">Em</b></td><td>minor</td><td>E · G · B</td><td>5 · 3 · 1</td></tr><tr><td><b class="r">F</b></td><td>major</td><td>F · A · C</td><td>5 · 3 · 1</td></tr><tr><td><b class="r">G</b></td><td>major</td><td>G · B · D</td><td>5 · 3 · 1</td></tr><tr><td><b class="t">Am</b></td><td>minor</td><td>A · C · E</td><td>5 · 3 · 1</td></tr></table></div>
<h3>Major or minor?</h3>
<p>Both are three notes stacked on alternate white keys. The difference is the middle note, the <b>third</b>: in a
major chord it sits a little higher, and the chord sounds bright; in a minor chord it sits a little lower, and the
chord sounds sad or serious. On these six chords your fingers never need a black key.</p>
<div class="box dark"><b>Why F, G and Am sit lower.</b> They are drawn below the C so that your hand moves as little as possible when the chords change. That is how a pianist plays them in a song.</div>

><template id="p13"><section class="page"><header><span>The Piano Left Hand Map</span><span class="sec">Pattern 1</span></header><div class="content">
<div class="phead"><div class="pnum">01</div><div><h1>The Anchor</h1>
<div class="meta"><span>4/4</span><span>quarter notes</span><span>easy</span></div></div></div>
<p class="lead">One note, held for the whole bar. It sounds almost too simple, and that is the point: it gives the song a floor to stand on while your right hand does the work.</p>

<div class="tw"><table class="grid g4"><tr><th class="strong">1</th><th class="beat">2</th><th class="beat">3</th><th class="beat">4</th></tr><tr><td>C</td><td><span class="hold">—</span></td><td><span class="hold">—</span></td><td><span class="hold">—</span></td></tr></table></div>
<div class="two">
  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>Put finger 5 on C below middle C. Let your other fingers rest lightly on the next keys.</li><li>Press on beat 1 and hold while you count 2, 3, 4 out loud.</li><li>Lift on the next beat 1 and press again. No gap, no rush.</li></ol></div>
  <div><h3>Sounds like</h3><p>Slow ballads, hymns, worship, your very first song.</p>
  <div class="box dark"><b>Common mistake.</b> Letting go too early. Count all four beats before you lift. The silence you leave by accident is louder than any wrong note.</div></div>
</div>

<div class="phead"><div class="pnum">02</div><div><h1>The Power Fifth</h1>
<div class="meta"><span>4/4</span><span>quarter notes</span><span>easy</span></div></div></div>
<p class="lead">Root and fifth together. There is no third, so the shape works for major and minor chords alike. Your hand never changes shape: it only slides.</p>

<div class="two">
  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>Finger 5 on C, thumb (1) on G. Your hand is now a fixed frame.</li><li>Press both together on beat 1, hold through beat 2.</li><li>Press again on beat 3, hold through beat 4.</li></ol></div>
  <div><h3>Sounds like</h3><p>Pop, rock ballads, film music, anything that needs a big, open sound.</p>
  <div class="box dark"><b>Common mistake.</b> Collapsing the frame when you move to the next chord. Keep 5 and 1 the same distance apart and move the whole hand, like a stamp.</div></div>
</div>

<div class="phead"><div class="pnum">03</div><div><h1>The Octave Pulse</h1>
<div class="meta"><span>4/4</span><span>quarter notes</span><span>easy</span></div></div></div>
<p class="lead">The same note in two places at once, struck on every beat. It is the left hand acting like a bass guitar and a drum at the same time.</p>

<div class="two">
  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>Finger 5 on the low C, thumb on the next C up.</li><li>Strike both together on every beat: 1, 2, 3, 4.</li><li>Keep the wrist loose and let the hand bounce from the wrist, not the elbow.</li></ol></div>
  <div><h3>Sounds like</h3><p>Driving pop, anthems, big choruses.</p>
  <div class="box dark"><b>Common mistake.</b> Tensing up. An octave is a wide stretch for a new hand. If it hurts, play only the low note with finger 5 until the stretch comes.</div></div>

<div class="phead"><div class="pnum">04</div><div><h1>The Root–Fifth Walk</h1>
<div class="meta"><span>4/4</span><span>quarter notes</span><span>easy</span></div></div></div>
<p class="lead">The Power Fifth split in two: root, fifth, root, fifth. The bass starts to move and the song starts to walk.</p>

<div class="two">
  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>Same frame as the Power Fifth: 5 on C, 1 on G.</li><li>Play C on beat 1, G on beat 2, C on beat 3, G on beat 4.</li><li>Make beat 1 a little stronger than the others.</li></ol></div>
  <div><h3>Sounds like</h3><p>Country, folk, children’s songs, marches.</p>
  <div class="box dark"><b>Common mistake.</b> Playing every beat at the same volume. Lean on beat 1: that is what makes it feel like a bar and not a list of notes.</div></div>

<div class="meta"><span>3/4</span><span>quarter notes</span><span>medium</span></div></div></div>
<p class="lead">Oom-pah-pah. The root on the strong beat, then the rest of the chord twice. It is the same rhythm an accordion or a guitar would use in three.</p>

<div class="two">

<div class="phead"><div class="pnum">07</div><div><h1>The Rolling Arpeggio</h1>
<div class="meta"><span>4/4</span><span>eighth notes</span><span>medium</span></div></div></div>
<p class="lead">The whole chord, one note at a time: up to the top and back down. It fills the space under a melody like water filling a glass.</p>

  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>5 on low C, 3 on E, 2 on G, 1 on the C above.</li><li>Up on “1 & 2 &”, down on “3 & 4”, and let the last note ring through the final “&”.</li><li>Start slowly. The goal is evenness, not speed.</li></ol></div>
  <div><h3>Sounds like</h3><p>Ballads, film music, gentle intros and endings.</p>
  <div class="box dark"><b>Common mistake.</b> Landing too hard on the thumb at the top. Let the line rise and fall like a wave, with no bump at the peak.</div></div>
</div>

<div class="phead"><div class="pnum">08</div><div><h1>The Alberti Bass</h1>
<div class="meta"><span>4/4</span><span>eighth notes</span><span>medium</span></div></div></div>
<p class="lead">Low, high, middle, high. Named after an 18th-century composer, it is the sound of countless classical sonatas, and it sits under one hand without moving.</p>

  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>Place the chord: 5 on C, 3 on E, 1 on G.</li><li>Play in the order 5 – 1 – 3 – 1: C, G, E, G.</li><li>Keep it soft. This pattern is a background, never the star.</li></ol></div>
  <div><h3>Sounds like</h3><p>Classical pieces, music boxes, light and bright songs.</p>
  <div class="box dark"><b>Common mistake.</b> Playing it loud and heavy. The Alberti bass is meant to murmur: play close to the keys with very little movement.</div></div>
</div>

<div class="meta"><span>4/4</span><span>eighth notes</span><span>challenge</span></div></div></div>

<div class="two">
  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>5 on C, 1 on G, as in the Power Fifth.</li><li>Strike together eight times per bar, counting “1 & 2 & 3 & 4 &”.</li><li>Accent beats 1 and 3 slightly so the groove has a shape.</li></ol></div>
  <div><h3>Sounds like</h3><p>Pop-rock, upbeat songs, energetic choruses.</p>
  <div class="box dark"><b>Common mistake.</b> Pressing from the arm. Short, light strokes from the wrist; otherwise the hand tires in a few bars.</div></div>

<div class="phead"><div class="pnum">10</div><div><h1>The Blues Shuffle</h1>
<div class="meta"><span>4/4</span><span>eighth notes</span><span>challenge</span></div></div></div>
<p class="lead">Finger 5 stays on the root while the top note rocks between the fifth and the sixth. Swing the eighths (long-short) and you have the left hand of 1950s rock ’n’ roll.</p>

<div class="two">
  <div><h3>Learn it in 3 steps</h3><ol class="steps"><li>5 on C. Finger 2 on G, thumb on A.</li><li>Two strikes with G, two strikes with A, and repeat.</li><li>Swing it: make each first eighth a little longer than the second, “daa-da daa-da”.</li></ol></div>
  <div><h3>Sounds like</h3><p>Blues, rock ’n’ roll, boogie, early rock.</p>
  <div class="box dark"><b>Common mistake.</b> Moving finger 5. The root never leaves its key; only the top finger changes. Use it on major chords (C, F, G).</div></div>
</div>

te><template id="p26"><section class="page"><header><span>The Piano Left Hand Map</span><span class="sec">Reference</span></header><div class="content">
<h1>The cheat sheet</h1>
<p class="lead">Print this page and keep it on the music stand.</p>
<h3>The chords</h3>
<div class="tw"><table class="t compact"><tr><th>chord</th><th>root</th><th>third</th><th>fifth</th><th>sixth (shuffle only)</th></tr><tr><td><b class="r">C</b></td><td>C</td><td>E</td><td>G</td><td>A</td></tr><tr><td><b class="t">Dm</b></td><td>D</td><td>F</td><td>A</td><td>–</td></tr><tr><td><b class="t">Em</b></td><td>E</td><td>G</td><td>B</td><td>–</td></tr><tr><td><b class="r">F</b></td><td>F</td><td>A</td><td>C</td><td>D</td></tr><tr><td><b class="r">G</b></td><td>G</td><td>B</td><td>D</td><td>E</td></tr><tr><td><b class="t">Am</b></td><td>A</td><td>C</td><td>E</td><td>–</td></tr></table></div>
<h3>The patterns, one bar in C</h3>
<p class="small">+ = together · — = keep holding · C′ = the next C up · to change chord, move the same shape so your pinky sits on the new root</p>
<div class="tw"><table class="t compact mono"><tr><th>#</th><th>pattern</th><th>time</th><th>one bar</th></tr><tr><td><b>1</b></td><td>The Anchor</td><td>4/4</td><td>C · — · — · —</td></tr><tr><td><b>2</b></td><td>The Power Fifth</td><td>4/4</td><td>C+G · — · C+G · —</td></tr><tr><td><b>3</b></td><td>The Octave Pulse</td><td>4/4</td><td>C+C′ · C+C′ · C+C′ · C+C′</td></tr><tr><td><b>4</b></td><td>The Root–Fifth Walk</td><td>4/4</td><td>C · G · C · G</td></tr><tr><td><b>5</b></td><td>The Waltz</td><td>3/4</td><td>C · E+G · E+G</td></tr><tr><td><b>6</b></td><td>The Ballad (1–5–8–5)</td><td>4/4</td><td>C · G · C′ · G · C · G · C′ · G</td></tr><tr><td><b>7</b></td><td>The Rolling Arpeggio</td><td>4/4</td><td>C · E · G · C′ · G · E · C · —</td></tr><tr><td><b>8</b></td><td>The Alberti Bass</td><td>4/4</td><td>C · G · E · G · C · G · E · G</td></tr><tr><td><b>9</b></td><td>Driving Eighths</td><td>4/4</td><td>C+G · C+G · C+G · C+G · C+G · C+G · C+G · C+G</td></tr><tr><td><b>10</b></td><td>The Blues Shuffle</td><td>4/4</td><td>C+G · C+G · C+A · C+A · C+G · C+G · C+A · C+A</td></tr></table></div>
</div><footer><span>The Piano Left Hand Map</span><span class="pn">27</span><span>Left hand</span></footer></section></template><template id="p27"><section class="page"><header><span>The Piano Left Hand Map</span><span class="sec">Reference</span></header><div class="content">
<h1>A 14-day plan</h1>
<p class="lead">Fifteen minutes a day is a good start. The order matters more than the time.</p>
<div class="tw"><table class="t compact"><tr><th>day</th><th>what to do</th></tr><tr><td>1</td><td>Keyboard map and fingers. Find every C on your piano with your eyes closed.</td></tr><tr><td>2</td><td>The four shapes on C. Then the six chords as triads, slowly.</td></tr><tr><td>3</td><td>Pattern 1, the Anchor, through the four-chord song.</td></tr><tr><td>4</td><td>Pattern 2, the Power Fifth, same song.</td></tr><tr><td>5</td><td>Patterns 3 and 4. Pick the one you like best.</td></tr><tr><td>6</td><td>Pattern 5, the Waltz, on the classic progression.</td></tr><tr><td>7</td><td>Rest day, or replay everything you know without stopping.</td></tr><tr><td>8</td><td>Pattern 6, the Ballad, on C only. Then add G.</td></tr><tr><td>9</td><td>Ballad through the four-chord song.</td></tr><tr><td>10</td><td>Pattern 7, the Arpeggio, on the emotional progression.</td></tr><tr><td>11</td><td>Pattern 8, the Alberti bass, on the fifties progression.</td></tr><tr><td>12</td><td>Patterns 9 and 10. Swing the shuffle.</td></tr><tr><td>13</td><td>Pick a song you love, find its chords online, choose a pattern.</td></tr><tr><td>14</td><td>Play that song from start to finish. Record yourself.</td></tr></table></div>
<div class="box dark"><b>Slow is fast.</b> Play every new pattern at half the speed you think you can. When it comes out clean five times in a row, speed up a little.</div>
</div><footer><span>The Piano Left Hand Map</span><span class="pn">28</span><span>Left hand</span></footer></section></template><template id="p28"><section class="page"><header><span>The Piano Left Hand Map</span><span class="sec">Next step</span></header><div class="content">
<h1>You know where everything is.<br>Next comes playing it.</h1>
<p class="lead">A map shows you the keys. Songs come from repetition: the same patterns, on the same chords, until
your left hand plays them without you watching it.</p>
<h3>Where to go from here</h3>
<div class="tw"><table class="t "><tr><th>step</th><th>what to do</th></tr><tr><td><b class="r">1</b></td><td>Choose one pattern per song and stay with it until it is automatic.</td></tr><tr><td><b class="r">2</b></td><td>Add your right hand on the melody, one note at a time, over the Anchor or the Power Fifth.</td></tr><tr><td><b class="r">3</b></td><td>Mix two patterns in one song: a gentle one for the verse, a moving one for the chorus.</td></tr></table></div>
<div class="box dark"><b>One last thing.</b> Come back to this map whenever a song feels stuck. Most of the time the answer is on one of these pages: the right chord, the right shape, or simply a slower tempo.</div>

blues shuffle 23 part 4 four progressions (1–2) 25 part 4 four progressions (3–4) 26 reference the cheat sheet 27 reference a 14-day plan 28 next step 29 the piano left hand map 3 left hand"}, {"t": "Part 1 · Know the territory", "d": true, "g": "main", "q": "part 1 know the territory where the left hand lives, which finger is which and the four shapes every pattern is built from. what this part covers 1 the keyboard map 2 the fingers of your left hand 3 the four basic shapes"}, {"t": "The keyboard map", "d": false, "g": "main", "q": "the piano left hand map part 1 the keyboard map a piano repeats the same pattern of twelve keys over and over. learn one group and you know the whole instrument. c d e f g a b c d e f g a b c d e f g a b c middle c c c c finding c look at the black keys: they come in groups of two and three . the white key just to the left of every group of two is a c . always. your territory the dashed frame is where the left hand plays in this guide: the two octaves below middle c . low enough to sound like a bass, close enough not to clash with the melody. name where used for middle c the c nearest the center of the piano, often under the brand name the border between the hands c below middle c the next c to the left of middle c home for most patterns in this guide low c the c after that, further left wide patterns: octave pulse, ballad, arpeggio keyboard or digital piano? everything here works on any instrument with at least 49 keys. on a 61-key keyboard, middle c is usually the third c from the left. the piano left hand map 5 left hand"}, {"t": "The fingers of your left hand", "d": false, "g": "main", "q": "the piano left hand map part 1 the fingers of your left hand pianists number the fingers from the thumb outward. in the left hand that means the pinky is 5 and the thumb is 1 . 5 pinky 4 ring 3 middle 2 index 1 thumb your left hand, palm down, as you see it over the keys. the one rule of this guide in almost every pattern, finger 5 sits on the root , the note that gives the chord its name. find the root, put your pinky on it, and the rest of the hand falls into place to its right. finger name usual job 5 pinky the root: the lowest note and the anchor 3 middle the third of the chord 2 index the fifth, when the thumb is busy higher up 1 thumb the fifth or the octave: the top of the hand curved fingers. play on the tips, with the fingers curved as if holding a ball. a flat pinky is weak and catches the black keys. the piano left hand map 6 left hand"}, {"t": "The four basic shapes", "d": false, "g": "main", "q": "the piano left hand map part 1 the four basic shapes the ten patterns in this guide are built from these four shapes, played in a different rhythm or order (the blues shuffle adds one extra note, the sixth). learn them on c and you have learned them on every chord. root one note c d e f g a b c 5 fifth root + fifth c d e f g a b c 5 1 octave root + root c d e f g a b c 5 1 triad the full chord c d e f g a b c 5 3 1 shape notes on c fingers sounds root c 5 simple, calm fifth c + g 5 · 1 open, powerful octave c + c′ 5 · 1 full, deep triad c + e + g 5 · 3 · 1 the complete chord the secret. the shape never changes from chord to chord. only the place does. move your pinky to a new root and the same hand shape gives you the new chord. the piano left hand map 7 left hand"}, {"t": "Part 2 · The six chords", "d": true, "g": "main", "q": "part 2 the six chords the six chords that cover thousands of songs, each one mapped key by key. what this part covers 1 the chord map 2 c and f 3 g and am 4 dm and em"}, {"t": "The chord map", "d": false, "g": "main", "q": "the piano left hand map part 2 the chord map these six chords all belong to the key of c, use only white keys, and between them cover a huge part of pop, folk, country and worship music. c d e f g a b c d e f g a b c middle c c dm em f g am where your pinky goes for each chord. rust = major · teal = minor . chord type notes fingers c major c · e · g 5 · 3 · 1 dm minor d · f · a 5 · 3 · 1 em minor e · g · b 5 · 3 · 1 f major f · a · c 5 · 3 · 1 g major g · b · d 5 · 3 · 1 am minor a · c · e 5 · 3 · 1 major or minor? both are three notes stacked on alternate white keys. the difference is the middle note, the third : in a major chord it sits a little higher, and the chord sounds bright; in a minor chord it sits a little lower, and the chord sounds sad or serious. on these six chords your fingers never need a black key. why f, g and am sit lower. they are drawn below the c so that your hand moves as little as possible when the chords change. that is how a pianist plays them in a song. the piano left hand map 9 left hand"}, {"t": "C", "d": false, "g": "main", "q": "the piano left hand map part 2 c c major c d e f g a b c d e f g a b c middle c 5 3 1 shape notes fingers root c 5 fifth c + g 5 · 1 octave c + c′ 5 · 1 triad c + e + g 5 · 3 · 1 f f major c d e f g a b c d e f g a b c middle c 5 3 1 shape notes fingers root f 5 fifth f + c 5 · 1 octave f + f′ 5 · 1 triad f + a + c 5 · 3 · 1 the piano left hand map 10 left hand"}, {"t": "G", "d": false, "g": "main", "q": "the piano left hand map part 2 g g major c d e f g a b c d e f g a b c middle c 5 3 1 shape notes fingers root g 5 fifth g + d 5 · 1 octave g + g′ 5 · 1 triad g + b + d 5 · 3 · 1 am a minor c d e f g a b c d e f g a b c middle c 5 3 1 shape notes fingers root a 5 fifth a + e 5 · 1 octave a + a′ 5 · 1 triad a + c + e 5 · 3 · 1 the piano left hand map 11 left hand"}, {"t": "Dm", "d": false, "g": "main", "q": "the piano left hand map part 2 dm d minor c d e f g a b c d e f g a b c middle c 5 3 1 shape notes fingers root d 5 fifth d + a 5 · 1 octave d + d′ 5 · 1 triad d + f + a 5 · 3 · 1 em e minor c d e f g a b c d e f g a b c middle c 5 3 1 shape notes fingers root e 5 fifth e + b 5 · 1 octave e + e′ 5 · 1 triad e + g + b 5 · 3 · 1 the piano left hand map 12 left hand"}, {"t": "Part 3 · The ten patterns", "d": true, "g": "main", "q": "part 3 the ten patterns from one held note to rock ’n’ roll. each pattern on its own page, in c, then moved to f, g and am. what this part covers 1–4 steady patterns: anchor, power fifth, octave pulse, root–fifth walk 5 in three: the waltz 6–10 moving patterns: ballad, arpeggio, alberti, driving eighths, shuffle"}, {"t": "The Anchor", "d": false, "g": "main", "q": "the piano left hand map pattern 1 01 the anchor 4/4 quarter notes easy one note, held for the whole bar. it sounds almost too simple, and that is the point: it gives the song a floor to stand on while your right hand does the work. c d e f g a b c d e f g a b c middle c 5 1 2 3 4 c — — — learn it in 3 steps put finger 5 on c below middle c. let your other fingers rest lightly on the next keys. press on beat 1 and hold while you count 2, 3, 4 out loud. lift on the next beat 1 and press again. no gap, no rush. sounds like slow ballads, hymns, worship, your very first song. common mistake. letting go too early. count all four beats before you lift. the silence you leave by accident is louder than any wrong note. move it chord what you play, cell by cell c c · — · — · — f f · — · — · — g g · — · — · — am a · — · — · — the piano left hand map 14 left hand"}, {"t": "The Power Fifth", "d": false, "g": "main", "q": "the piano left hand map pattern 2 02 the power fifth 4/4 quarter notes easy root and fifth together. there is no third, so the shape works for major and minor chords alike. your hand never changes shape: it only slides. c d e f g a b c d e f g a b c middle c 5 1 1 2 3 4 c+g — c+g — learn it in 3 steps finger 5 on c, thumb (1) on g. your hand is now a fixed frame. press both together on beat 1, hold through beat 2. press again on beat 3, hold through beat 4. sounds like pop, rock ballads, film music, anything that needs a big, open sound. common mistake. collapsing the frame when you move to the next chord. keep 5 and 1 the same distance apart and move the whole hand, like a stamp. move it chord what you play, cell by cell c c+g · — · c+g · — f f+c · — · f+c · — g g+d · — · g+d · — am a+e · — · a+e · — the piano left hand map 15 left hand"}, {"t": "The Octave Pulse", "d": false, "g": "main", "q": "the piano left hand map pattern 3 03 the octave pulse 4/4 quarter notes easy the same note in two places at once, struck on every beat. it is the left hand acting like a bass guitar and a drum at the same time. c d e f g a b c d e f g a b c middle c 5 1 1 2 3 4 c+c′ c+c′ c+c′ c+c′ learn it in 3 steps finger 5 on the low c, thumb on the next c up. strike both together on every beat: 1, 2, 3, 4. keep the wrist loose and let the hand bounce from the wrist, not the elbow. sounds like driving pop, anthems, big choruses. common mistake. tensing up. an octave is a wide stretch for a new hand. if it hurts, play only the low note with finger 5 until the stretch comes. move it chord what you play, cell by cell c c+c′ · c+c′ · c+c′ · c+c′ f f+f′ · f+f′ · f+f′ · f+f′ g g+g′ · g+g′ · g+g′ · g+g′ am a+a′ · a+a′ · a+a′ · a+a′ the piano left hand map 16 left hand"}, {"t": "The Root–Fifth Walk", "d": false, "g": "main", "q": "the piano left hand map pattern 4 04 the root–fifth walk 4/4 quarter notes easy the power fifth split in two: root, fifth, root, fifth. the bass starts to move and the song starts to walk. c d e f g a b c d e f g a b c middle c 5 1 1 2 3 4 c g c g learn it in 3 steps same frame as the power fifth: 5 on c, 1 on g. play c on beat 1, g on beat 2, c on beat 3, g on beat 4. make beat 1 a little stronger than the others. sounds like country, folk, children’s songs, marches. common mistake. playing every beat at the same volume. lean on beat 1: that is what makes it feel like a bar and not a list of notes. move it chord what you play, cell by cell c c · g · c · g f f · c · f · c g g · d · g · d am a · e · a · e the piano left hand map 17 left hand"}, {"t": "The Waltz", "d": false, "g": "main", "q": "the piano left hand map pattern 5 05 the waltz 3/4 quarter notes medium oom-pah-pah. the root on the strong beat, then the rest of the chord twice. it is the same rhythm an accordion or a guitar would use in three. c d e f g a b c d e f g a b c middle c 5 3 1 1 2 3 c e+g e+g learn it in 3 steps place the whole chord: 5 on c, 3 on e, 1 on g. beat 1: only finger 5. beats 2 and 3: fingers 3 and 1 together, shorter and lighter. sounds like waltzes, country ballads, folk songs, anything in three. common mistake. making the “pah” as loud as the “oom”. the root is the dancer’s heavy step; the chord is the light one. move it chord what you play, cell by cell c c · e+g · e+g f f · a+c · a+c g g · b+d · b+d am a · c+e · c+e the piano left hand map 18 left hand"}, {"t": "The Ballad (1–5–8–5)", "d": false, "g": "main", "q": "the piano left hand map pattern 6 06 the ballad (1–5–8–5) 4/4 eighth notes medium root, fifth, octave, fifth, going round in even eighth notes. one shape that makes almost any slow song sound like a real pianist is playing. c d e f g a b c d e f g a b c middle c 5 2 1 1 & 2 & 3 & 4 & c g c′ g c g c′ g learn it in 3 steps 5 on low c, 2 on g, 1 on the next c. the hand stays open the whole time. play the four notes in order and count “1 & 2 &”. repeat for “3 & 4 &”. then hold the pedal down for the whole bar if you have one. sounds like piano ballads, slow pop, worship, love songs. common mistake. rushing the last “&”. the pattern must loop without a hiccup: practice the turn from the last g back to the low c on its own. move it chord what you play, cell by cell c c · g · c′ · g · c · g · c′ · g f f · c · f′ · c · f · c · f′ · c g g · d · g′ · d · g · d · g′ · d am a · e · a′ · e · a · e · a′ · e the piano left hand map 19 left hand"}, {"t": "The Rolling Arpeggio", "d": false, "g": "main", "q": "the piano left hand map pattern 7 07 the rolling arpeggio 4/4 eighth notes medium the whole chord, one note at a time: up to the top and back down. it fills the space under a melody like water filling a glass. c d e f g a b c d e f g a b c middle c 5 3 2 1 1 & 2 & 3 & 4 & c e g c′ g e c — learn it in 3 steps 5 on low c, 3 on e, 2 on g, 1 on the c above. up on “1 & 2 &”, down on “3 & 4”, and let the last note ring through the final “&”. start slowly. the goal is evenness, not speed. sounds like ballads, film music, gentle intros and endings. common mistake. landing too hard on the thumb at the top. let the line rise and fall like a wave, with no bump at the peak. move it chord what you play, cell by cell c c · e · g · c′ · g · e · c · — f f · a · c · f′ · c · a · f · — g g · b · d · g′ · d · b · g · — am a · c · e · a′ · e · c · a · — the piano left hand map 20 left hand"}, {"t": "The Alberti Bass", "d": false, "g": "main", "q": "the piano left hand map pattern 8 08 the alberti bass 4/4 eighth notes medium low, high, middle, high. named after an 18th-century composer, it is the sound of countless classical sonatas, and it sits under one hand without moving. c d e f g a b c d e f g a b c middle c 5 1 3 1 & 2 & 3 & 4 & c g e g c g e g learn it in 3 steps place the chord: 5 on c, 3 on e, 1 on g. play in the order 5 – 1 – 3 – 1: c, g, e, g. keep it soft. this pattern is a background, never the star. sounds like classical pieces, music boxes, light and bright songs. common mistake. playing it loud and heavy. the alberti bass is meant to murmur: play close to the keys with very little movement. move it chord what you play, cell by cell c c · g · e · g · c · g · e · g f f · c · a · c · f · c · a · c g g · d · b · d · g · d · b · d am a · e · c · e · a · e · c · e the piano left hand map 21 left hand"}, {"t": "Driving Eighths", "d": false, "g": "main", "q": "the piano left hand map pattern 9 09 driving eighths 4/4 eighth notes challenge the power fifth struck on every eighth note. it is what a rhythm guitarist does with a pick, moved into your left hand. c d e f g a b c d e f g a b c middle c 5 1 1 & 2 & 3 & 4 & c+g c+g c+g c+g c+g c+g c+g c+g learn it in 3 steps 5 on c, 1 on g, as in the power fifth. strike together eight times per bar, counting “1 & 2 & 3 & 4 &”. accent beats 1 and 3 slightly so the groove has a shape. sounds like pop-rock, upbeat songs, energetic choruses. common mistake. pressing from the arm. short, light strokes from the wrist; otherwise the hand tires in a few bars. move it chord what you play, cell by cell c c+g · c+g · c+g · c+g · c+g · c+g · c+g · c+g f f+c · f+c · f+c · f+c · f+c · f+c · f+c · f+c g g+d · g+d · g+d · g+d · g+d · g+d · g+d · g+d am a+e · a+e · a+e · a+e · a+e · a+e · a+e · a+e the piano left hand map 22 left hand"}, {"t": "The Blues Shuffle", "d": false, "g": "main", "q": "the piano left hand map pattern 10 10 the blues shuffle 4/4 eighth notes challenge finger 5 stays on the root while the top note rocks between the fifth and the sixth. swing the eighths (long-short) and you have the left hand of 1950s rock ’n’ roll. c d e f g a b c d e f g a b c middle c 5 2 1 1 & 2 & 3 & 4 & c+g c+g c+a c+a c+g c+g c+a c+a learn it in 3 steps 5 on c. finger 2 on g, thumb on a. two strikes with g, two strikes with a, and repeat. swing it: make each first eighth a little longer than the second, “daa-da daa-da”. sounds like blues, rock ’n’ roll, boogie, early rock. common mistake. moving finger 5. the root never leaves its key; only the top finger changes. use it on major chords (c, f, g). move it chord what you play, cell by cell c c+g · c+g · c+a · c+a · c+g · c+g · c+a · c+a f f+c · f+c · f+d · f+d · f+c · f+c · f+d · f+d g g+d · g+d · g+e · g+e · g+d · g+d · g+e · g+e the piano left hand map 23 left hand"}, {"t": "Part 4 · From pattern to song", "d": true, "g": "main", "q": "part 4 from pattern to song four chord progressions behind thousands of songs, and which pattern to try on each. what this part covers 1 four progressions 2 the one-page cheat sheet 3 a 14-day plan"}, {"t": "Four progressions", "d": false, "g": "main", "q": "the piano left hand map part 4 four progressions one chord per bar, four bars, then repeat. the letter in each bar tells you where your pinky goes; the pattern does the rest. the four-chord song one of the most used progressions in modern pop. bar 1 c c bar 2 g g bar 3 am a bar 4 f f c d e f g a b c d e f g a b c c g am f try it with: ballad, power fifth, driving eighths the classic folk, country, rock ’n’ roll and children’s songs. bar 1 c c bar 2 f f bar 3 g g bar 4 c c c d e f g a b c d e f g a b c c f g try it with: root–fifth walk, waltz, shuffle the piano left hand map 25 left hand"}, {"t": "The emotional one", "d": false, "g": "main", "q": "the piano left hand map part 4 the emotional one the same four chords, starting on the minor: instantly more dramatic. bar 1 am a bar 2 f f bar 3 c c bar 4 g g c d e f g a b c d e f g a b c am f c g try it with: arpeggio, ballad, octave pulse the fifties doo-wop and old-school love songs. bar 1 c c bar 2 am a bar 3 f f bar 4 g g c d e f g a b c d e f g a b c c am f g try it with: waltz, alberti, ballad change on beat 1. the chord changes exactly when the bar does. if the move is late, practice only the last beat of one bar and the first beat of the next, ten times. the piano left hand map 26 left hand"}, {"t": "The cheat sheet", "d": false, "g": "main", "q": "the piano left hand map reference the cheat sheet print this page and keep it on the music stand. the chords chord root third fifth sixth (shuffle only) c c e g a dm d f a – em e g b – f f a c d g g b d e am a c e – the patterns, one bar in c + = together · — = keep holding · c′ = the next c up · to change chord, move the same shape so your pinky sits on the new root # pattern time one bar 1 the anchor 4/4 c · — · — · — 2 the power fifth 4/4 c+g · — · c+g · — 3 the octave pulse 4/4 c+c′ · c+c′ · c+c′ · c+c′ 4 the root–fifth walk 4/4 c · g · c · g 5 the waltz 3/4 c · e+g · e+g 6 the ballad (1–5–8–5) 4/4 c · g · c′ · g · c · g · c′ · g 7 the rolling arpeggio 4/4 c · e · g · c′ · g · e · c · — 8 the alberti bass 4/4 c · g · e · g · c · g · e · g 9 driving eighths 4/4 c+g · c+g · c+g · c+g · c+g · c+g · c+g · c+g 10 the blues shuffle 4/4 c+g · c+g · c+a · c+a · c+g · c+g · c+a · c+a the piano left hand map 27 left hand"}, {"t": "A 14-day plan", "d": false, "g": "main", "q": "the piano left hand map reference a 14-day plan fifteen minutes a day is a good start. the order matters more than the time. day what to do 1 keyboard map and fingers. find every c on your piano with your eyes closed. 2 the four shapes on c. then the six chords as triads, slowly. 3 pattern 1, the anchor, through the four-chord song. 4 pattern 2, the power fifth, same song. 5 patterns 3 and 4. pick the one you like best. 6 pattern 5, the waltz, on the classic progression. 7 rest day, or replay everything you know without stopping. 8 pattern 6, the ballad, on c only. then add g. 9 ballad through the four-chord song. 10 pattern 7, the arpeggio, on the emotional progression. 11 pattern 8, the alberti bass, on the fifties progression. 12 patterns 9 and 10. swing the shuffle. 13 pick a song you love, find its chords online, choose a pattern. 14 play that song from start to finish. record yourself. slow is fast. play every new pattern at half the speed you think you can. when it comes out clean five times in a row, speed up a little. the piano left hand map 28 left hand"}, {"t": "You know where everything is. Next comes playing it.", "d": false, "g": "main", "q": "the piano left hand map next step you know where everything is. next comes playing it. a map shows you the keys. songs come from repetition: the same patterns, on the same chords, until your left hand plays them without you watching it. where to go from here step what to do 1 choose one pattern per song and stay with it until it is automatic. 2 add your right hand on the melody, one note at a time, over the anchor or the power fifth. 3 mix two patterns in one song: a gentle one for the verse, a moving one for the chorus. one last thing. come back to this map whenever a song feels stuck. most of the time the answer is on one of these pages: the right chord, the right shape, or simply a slower tempo. the piano left hand map 29 left hand"}],T={"install": "Install the app", "installed": "Open from your home screen", "cont": "Continue where you left off", "start": "Start reading", "contents": "Contents", "fav": "Saved pages", "nofav": "Tap ☆ on any page to save it here.", "page": "Page", "of": "of", "prev": "Back", "next": "Next", "bonus": "Free bonuses", "ios_t": "Install on your iPhone", "ios1": "Tap the Share button", "ios2": "Scroll down and tap “Add to Home Screen”", "ios3": "Tap “Add”. The app icon appears on your home screen.", "inapp_t": "Open in your browser to install", "inapp": "You opened this inside Facebook/Instagram. Tap ⋯ (top right) and choose “Open in browser” (Chrome or Safari). Then install.", "copy": "Copy link", "copied": "Link copied!", "other_t": "Install the app", "other": "Android: tap the ⋮ menu (top right) and choose “Install app” or “Add to Home screen”. iPhone: open this link in Safari.", "close": "Close", "pdf": "Download the printable version", "search": "Search", "offline": "Works offline after the first visit.", "home": "Home", "cover": "Cover", "acc_t": "Your access is ready", "acc_open": "OPEN THE APP", "acc_how": "How to install it on your phone", "acc_and": "Android: open the link in Chrome and tap “Install the app”. One tap and it is on your home screen.", "acc_ios": "iPhone: open the link in Safari, tap Share (the square with the arrow) and then “Add to Home Screen”.", "acc_keep": "Save this file: the link is your permanent access."},K='app:the-piano-left-hand-map:',cur=-1,dp=null;
